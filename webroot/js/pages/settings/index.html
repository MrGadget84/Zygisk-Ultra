<div class="panel">
  <div class="header" style="font-size: 30px">Zygisk-Ultra: {{title}} </div>

  <!-- INFO: Change language -->
  <div id="lang_page_toggle" class="small_card dimc card_animation">
    <div class="dimc" style="display: inline-block;">
      <div class="dimc content" style="font-size: 1.1em; padding-left: 5px; padding-top: 6px; padding-bottom: 2px;">
        {{language.title}}
      </div>
      <div class="dimc desc" style="font-size: 0.9em; padding-left: 5px; padding-bottom: 6px;">
        {{language.description}}
      </div>
    </div>
  </div>

  <div id="theme_page_toggle" style="margin-top: 15px;" class="small_card dimc card_animation">
    <div class="dimc" style="display: inline-block;">
      <div class="dimc content" style="font-size: 1.1em; padding-left: 5px; padding-top: 6px; padding-bottom: 2px;">
        {{theme.title}}
      </div>
      <div class="dimc desc" style="font-size: 0.9em; padding-left: 5px; padding-bottom: 6px;">
        {{theme.description}}
      </div>
    </div>
  </div>

  <div class="small_card dimc" style="margin-top: 15px;">
    <div class="action_card">
      <div class="dimc content action_card_title">
        {{fullscreen.title}}
      </div>
      <div class="dimc desc action_card_description">
        {{fullscreen.description}}
      </div>
    </div>

    <label class="switch dimc">
      <input id="rz_webui_fullscreen_switch" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>

  <div class="small_card dimc" style="margin-top: 15px;">
    <div class="action_card">
      <div class="dimc content action_card_title">
        {{font.title}}
      </div>
      <div class="dimc desc action_card_description">
        {{font.description}}
      </div>
    </div>

    <label class="switch dimc">
      <input id="rz_webui_font_switch" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
  
  <!-- INFO: License card -->
  <div class="dim card" style="margin-top: 15px;">
    <div class="dimc">
      <div id="mlic_title" class="dimc" style="font-size: 1.1em">{{moduleLicense}}</div>
      <div class="dimc desc" style="font-size: 0.9em; margin-top: 3px;">AGPL 3</div>
    </div>
  </div>
</div>
