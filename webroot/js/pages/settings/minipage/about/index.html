<div class="panel about-panel">
  <div class="dim card about-title-card">
    <div class="about-title-line">
      <span id="about_module_name" class="about-module-name">Zygisk-Ultra</span>
      <span id="about_version_value" class="about-version">development</span>
    </div>
    <div class="about-base">built on the BreZygisk</div>
  </div>

  <div class="small_card dimc card_animation about-author-card">
    <div class="about-avatar-link" credit-link="github.com/MrGadget84" role="link" tabindex="0" aria-label="MrGadget84 on GitHub">
      <div id="about_author_avatar_fallback" class="about-avatar-fallback">MG</div>
      <img id="about_author_avatar" class="about-avatar" src="https://avatars.githubusercontent.com/u/270354970?s=128&v=4" alt="MrGadget84" loading="lazy">
    </div>
    <div class="about-author"><span>{{authorLabel}}:</span> <strong>MrGadget84</strong></div>
    <div class="about-author-spacer" aria-hidden="true"></div>
  </div>

  <div class="small_card dimc card_animation about-link-card" credit-link="github.com/MrGadget84/Zygisk-Ultra" role="link" tabindex="0" style="cursor: pointer; margin-top: 15px;">
    <div class="dimc about-link-text">{{sourceCode}}</div>
    <div class="dimc about-link-icon">↗</div>
  </div>

  <div class="small_card dimc card_animation about-link-card" credit-link="github.com/MrGadget84/Zygisk-Ultra/blob/main/webroot/LICENSE" role="link" tabindex="0" style="margin-top: 12px; cursor: pointer;">
    <div class="dimc about-link-copy">
      <div class="dimc about-link-text">{{moduleLicense}}</div>
      <div class="dimc desc about-license-value">{{moduleLicenseValue}}</div>
    </div>
    <div class="dimc about-link-icon">↗</div>
  </div>
</div>
