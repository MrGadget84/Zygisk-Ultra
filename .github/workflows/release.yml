name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Build
        run: make all -j"$(nproc)"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zygisk-Ultra-release
          path: build/out/Zygisk-Ultra-*-release.zip
          archive: false

      - name: Upload debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: Zygisk-Ultra-debug
          path: build/out/Zygisk-Ultra-*-debug.zip
          archive: false

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Zygisk-Ultra ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/out/Zygisk-Ultra-*-release.zip

      - name: Generate update.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          release_zips=(build/out/Zygisk-Ultra-*-release.zip)
          if [[ "${#release_zips[@]}" -ne 1 ]]; then
            echo "Expected exactly one release ZIP; found ${#release_zips[@]}"
            printf '%s\n' "${release_zips[@]}"
            exit 1
          fi

          zip_file="${release_zips[0]}"
          unzip -p "$zip_file" module.prop > "$RUNNER_TEMP/module.prop"

          version="$(sed -n 's/^version=//p' "$RUNNER_TEMP/module.prop" | head -n 1 | tr -d '\r')"
          version_code="$(sed -n 's/^versionCode=//p' "$RUNNER_TEMP/module.prop" | head -n 1 | tr -d '\r')"

          if [[ -z "$version" || ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "Could not read valid version/versionCode from module.prop in $zip_file"
            cat "$RUNNER_TEMP/module.prop"
            exit 1
          fi

          zip_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/$(basename "$zip_file")"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"

          jq -n \
            --arg version "$version" \
            --argjson versionCode "$version_code" \
            --arg zipUrl "$zip_url" \
            --arg changelog "$changelog_url" \
            '{version: $version, versionCode: $versionCode, zipUrl: $zipUrl, changelog: $changelog}' \
            > "$RUNNER_TEMP/update.json"

          echo "Generated update.json:"
          cat "$RUNNER_TEMP/update.json"

      - name: Checkout main for update.json
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v6
        with:
          ref: main
          path: update-repo
          fetch-depth: 0

      - name: Publish update.json to main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/update.json" update-repo/update.json

          cd update-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json

          if git diff --cached --quiet; then
            echo "update.json has not changed; nothing to commit."
            exit 0
          fi

          git commit -m "chore: update module update.json for ${RELEASE_TAG}"
          git push origin HEAD:main

